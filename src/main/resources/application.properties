spring.application.name=safelaw

# ===== 판례 DB 경로 =====
# 두 경로 모두 서버 실행 위치(프로젝트 루트) 기준 상대 경로 또는 절대 경로
# 파일/폴더가 없으면 서버가 시작되지 않는다.
# ObjectBox 벡터 DB 폴더 (data.mdb 포함)
safelaw.objectbox.directory=safelaw-db
# SQLite 판례 본문 DB 파일 (파일명 LawData.db 오타 주의)
safelaw.sqlite.path=LawData.db

# ===== 회원 DB =====
# 판례 DB는 업데이트 때 파일째 교체되므로 회원 정보는 별도 SQLite 파일에 저장한다.
# 판례 DB와 달리 파일이 없으면 새로 만든다.
safelaw.user-db.path=safelaw-users.db

# ===== 인증 (JWT) =====
# 서명 키는 32바이트 이상. 저장소에 올리지 말고 환경변수 SAFELAW_JWT_SECRET으로 넣는다.
# 비워두면 실행할 때마다 임의 키를 만들어서, 서버를 재시작하면 기존 로그인이 모두 풀린다.
safelaw.auth.jwt.secret=${SAFELAW_JWT_SECRET:}
safelaw.auth.jwt.access-token-validity=7d

# ===== 소셜 로그인 =====
# 앱이 보낸 ID 토큰의 aud(발급 대상)가 여기 적힌 값 중 하나여야 통과한다. 여러 개면 쉼표로 구분.
# Google: Google Cloud 콘솔의 OAuth 클라이언트 ID (React Native Google Sign-In은 "웹 클라이언트 ID")
# Apple: 앱의 Bundle ID (예: com.safelaw.app)
# 비워두면 해당 소셜 로그인은 503 SOCIAL_LOGIN_NOT_CONFIGURED로 응답한다.
safelaw.auth.social.google-client-ids=${SAFELAW_GOOGLE_CLIENT_IDS:}
safelaw.auth.social.apple-client-ids=${SAFELAW_APPLE_CLIENT_IDS:}

# ===== 검색 =====
# 벡터 근사 검색(HNSW) 시 먼저 찾는 후보 수. 이 중 상위 topK개를 반환한다. 클수록 정확하지만 느려진다.
safelaw.search.candidates=100

# ===== JPA (SQLite) =====
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
# REST API만 제공하므로 뷰 렌더링까지 DB 세션을 열어둘 필요 없음
spring.jpa.open-in-view=false

# ===== Swagger =====
# springdoc 3.x 기본값은 OpenAPI 3.1이라, 예전 swagger-ui가 캐시된 브라우저에서도 열리도록 3.0으로 고정
springdoc.api-docs.version=openapi_3_0

# ===== 온디바이스 답변 생성 LLM 배포 정보 (/api/v1/system/model/latest) =====
# 임베딩 모델은 앱에 내장되므로 여기서 배포하지 않는다.
# TODO: 실제 업로드한 파일의 URL, 크기(byte), SHA-256 값으로 채울 것
safelaw.release.model.version=1.2.0
safelaw.release.model.url=https://safelaw-storage.s3.ap-northeast-2.amazonaws.com/models/v1.2.0-core.gguf
safelaw.release.model.size-bytes=0
safelaw.release.model.sha256=
